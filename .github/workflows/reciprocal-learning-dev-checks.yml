name: LYVRA Reciprocal Learning DEV Tests
on:
  push:
    branches: [lyvrabot-dev-native-livecircle-20261002]
    paths:
      - 'native_bridge/reciprocal_learning.py'
      - 'tests/test_reciprocal_learning.py'
      - '.github/workflows/reciprocal-learning-dev-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-reciprocal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify code syntax
        run: python -m py_compile native_bridge/reciprocal_learning.py tests/test_reciprocal_learning.py
      - name: Run safe offline tests without secrets or Discord
        run: python -m unittest -v tests/test_reciprocal_learning.py
      - name: Verify no private runtime artifacts
        run: |
          test ! -f .env
          test ! -e state/lyvra_livecircle.sqlite3
          test ! -e character_state
